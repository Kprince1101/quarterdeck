name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

  clean-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Copy the clone onto a clean Node 22 image, npm install and run npm run quarterdeck -- up
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          node:22-bookworm-slim
          sh /repo/scripts/clean-machine/run.sh /repo

  store-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: quarterdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      postgres14:
        image: postgres:14.19-alpine
        env:
          POSTGRES_PASSWORD: quarterdeck
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      QUARTERDECK_TEST_DATABASE_URL: postgres://postgres:quarterdeck@localhost:5432/postgres
      QUARTERDECK_TEST_PG14_URL: postgres://postgres:quarterdeck@localhost:5433/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Store, API and stream suites on PGlite and Postgres
        run: npx vitest run packages/server/test/store packages/server/test/api packages/server/test/stream
